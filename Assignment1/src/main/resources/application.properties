spring.application.name=COMP3011 Assignment 1

# A .properties file uses key=value pairs that Spring reads when the application starts.
# Practical 4 concept: blocking cloud I/O is a good use of lightweight virtual threads.
# A virtual thread can wait for the transcription response without holding one platform thread.
spring.threads.virtual.enabled=true

# Keep enough request capacity for the assignment's 200+ concurrent-request test.
# This limit is deliberately above 200 while still placing a finite bound on server resources.
server.tomcat.threads.max=256

# Graceful shutdown stops accepting new work while allowing in-flight requests to finish.
server.shutdown=graceful
# Bound Spring's draining phase to four seconds. This leaves time inside TITAN's
# five-second window for the Java process to complete its clean exit.
spring.lifecycle.timeout-per-shutdown-phase=4s

# ${OPENAI_API_KEY:} asks Spring to read OPENAI_API_KEY from the environment.
# The value after the colon is an empty default, so the app can start locally
# without placing a secret API key in the source code or Git history.
openai.api-key=${OPENAI_API_KEY:}
# Keeping the model configurable avoids hard-coding provider settings in Java.
openai.model=gpt-4o-mini-transcribe
# Tests can replace this configurable address with a local test server.
openai.base-url=https://api.openai.com
