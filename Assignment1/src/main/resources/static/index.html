
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- viewport makes the layout use the real device width on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Record a short message and convert it to text.">
    <title>Speech to text</title>
    <!-- CSS file -->
    <link rel="stylesheet" href="/styles.css">
    <!-- JS file -->
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <!-- aria-labelledby gives this section the accessible name stored in page-title -->
        <section class="recorder-card" aria-labelledby="page-title">
            <!-- &amp; is the HTML character entity used to display an ampersand -->
            <p class="eyebrow">Cloud &amp; Concurrent Programming</p>
            <h1 id="page-title">Audio Transcription</h1>
            <p class="introduction">
                Record a message of up to one minute to be transcribed.
            </p>

            <!--
                role="status" and aria-live="polite" announce changes when the reader is ready
                aria-atomic="true" makes the complete status message get announced together
            -->
            <div class="status-panel" role="status" aria-live="polite" aria-atomic="true">
                <!-- aria-hidden hides this decorative dot from assistive technology -->
                <span class="status-indicator" aria-hidden="true"></span>
                <span id="status-text">Ready to record</span>
                <!-- hidden removes the timer until JavaScript starts a recording -->
                <span id="recording-time" class="recording-time" hidden>0:00</span>
            </div>


            <div class="controls">
                <button id="start-button" class="button button-primary" type="button">
                    Start audio recording
                </button>
                <button id="stop-button" class="button button-secondary" type="button" disabled>
                    Stop recording
                </button>
            </div>

            <!--
                role="alert" announces errors; tabindex="-1" lets JS move focus here
                hidden keeps empty error area out of page until an error occurs
            -->
            <p id="error-message" class="error-message" role="alert" tabindex="-1" hidden></p>

            <!-- A second section groups the heading, state and returned transcription -->
            <section class="result-panel" aria-labelledby="result-title">
                <div class="result-heading">
                    <h2 id="result-title">Transcription</h2>
                    <span id="result-state">Waiting for a recording</span>
                </div>
                <p id="transcription" class="transcription" tabindex="-1">
                    Transcription will appear here.
                </p>
            </section>
        </section>
    </main>
</body>
</html>
